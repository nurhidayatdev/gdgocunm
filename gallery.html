<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
        />
        <meta
            name="description"
            content="Documentation & Activities Gallery of Google Developer Groups on Campus Universitas Negeri Makassar (GDGoC UNM). Explore our tech workshops, hackathons, and community study jams."
        />
        <meta name="theme-color" content="#171B21" />
        <title>Activities Gallery • GDGoC UNM</title>

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="assets/logo/favicon.png" />

        <!-- Google Fonts: Google Sans & Space Grotesk -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap"
            rel="stylesheet"
        />

        <!-- Codebase Stylesheets -->
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/animations.css" />
    </head>
    <body>
        <!-- Background Tech Grid & Ambient Glows per design.md -->
        <div class="tech-grid-overlay" aria-hidden="true"></div>
        <div class="ambient-glow" aria-hidden="true"></div>

        <!-- Shared Navbar Component Placeholder -->
        <div id="navbar-placeholder"></div>

        <!-- ========================================================================
             Main Content: Activities Gallery Showcase
             ======================================================================== -->
        <main class="main-content" id="main-content">
            <!-- Hero Header Section -->
            <section class="section gallery-hero-section">
                <div class="container">
                    <div class="section-header">
                        <div class="pill-badge">
                            <span class="pill-dot"></span>
                            <span>ACTIVITIES & DOCUMENTATION</span>
                        </div>
                        <h1 class="section-title">Activities & Event Gallery</h1>
                        <p class="section-subtitle">
                            Kumpulan dokumentasi momen terbaik, workshop teknologi, study jam, dan kebersamaan di Google Developer Groups on Campus Universitas Negeri Makassar.
                        </p>
                    </div>

                    <!-- Search Input -->
                    <div class="gallery-search-box">
                        <svg class="gallery-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input
                            type="text"
                            id="gallerySearchInput"
                            placeholder="Cari dokumentasi kegiatan, topik, atau tanggal..."
                            oninput="filterGallery()"
                        />
                    </div>

                    <!-- Filter Bar & Counter -->
                    <div class="gallery-filter-bar">
                        <div class="gallery-category-tabs" id="galleryCategoryTabs">
                            <!-- Populated dynamically -->
                        </div>
                        <div class="gallery-stats-text" id="galleryStatsCounter">
                            Memuat dokumentasi...
                        </div>
                    </div>

                    <!-- Albums Grid -->
                    <div class="gallery-albums-grid" id="galleryAlbumsContainer">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </section>
        </main>

        <!-- ========================================================================
             Fullscreen Interactive Lightbox Modal
             ======================================================================== -->
        <div class="gallery-lightbox-backdrop" id="galleryLightbox" role="dialog" aria-modal="true" aria-label="Photo Lightbox">
            <!-- Top Bar -->
            <div class="lightbox-header">
                <div class="lightbox-title-area">
                    <h3 id="lightboxAlbumTitle" style="font-size: 1.15rem; font-weight: 700; color: #ffffff; margin: 0;">Judul Kegiatan</h3>
                    <div id="lightboxAlbumMeta" style="font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px;">Tanggal • Kategori</div>
                </div>
                <div style="display: flex; align-items: center; gap: 14px;">
                    <span class="lightbox-counter-pill" id="lightboxPhotoCounter">Foto 1 dari 1</span>
                    <button type="button" class="lightbox-close-btn" onclick="closeLightbox()" aria-label="Close Lightbox">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Main Photo Stage with Prev/Next buttons -->
            <div class="lightbox-view-area">
                <button type="button" class="lightbox-nav-btn prev" onclick="navigateLightbox(-1)" aria-label="Previous Photo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>

                <img id="lightboxMainImg" src="" alt="Documentation Photo" class="lightbox-main-img" />

                <button type="button" class="lightbox-nav-btn next" onclick="navigateLightbox(1)" aria-label="Next Photo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>

            <!-- Bottom Thumbnails Carousel -->
            <div class="lightbox-thumbs-carousel" id="lightboxThumbsCarousel">
                <!-- Dynamically populated thumbnails -->
            </div>
        </div>

        <!-- Shared Footer Component Placeholder -->
        <div id="footer-placeholder"></div>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/data.js"></script>
        <script src="js/supabase-client.js"></script>
        <script src="js/components.js"></script>

        <script>
            (function () {
                'use strict';

                let allAlbums = [];
                let currentCategory = 'all';
                let currentSearchQuery = '';

                // Active Lightbox State
                let activeAlbum = null;
                let activePhotoIndex = 0;

                const colorMap = {
                    blue: '#4285F4',
                    green: '#34A853',
                    yellow: '#FBBC04',
                    red: '#EA4335'
                };

                // Fetch Gallery Albums
                async function loadGalleryAlbums() {
                    try {
                        if (window.GDG_SUPABASE && typeof window.GDG_SUPABASE.getGallery === 'function') {
                            allAlbums = await window.GDG_SUPABASE.getGallery();
                        }
                    } catch (e) {
                        console.warn('[Gallery] Error loading from Supabase:', e);
                    }

                    if (!allAlbums || allAlbums.length === 0) {
                        allAlbums = (window.GDG_DATA && window.GDG_DATA.gallery) || [];
                    }

                    renderCategoryTabs();
                    filterGallery();

                    // Check for URL query param e.g. gallery.html?id=gal-1
                    const urlParams = new URLSearchParams(window.location.search);
                    const targetId = urlParams.get('id');
                    if (targetId) {
                        const targetAlbum = allAlbums.find(a => String(a.id) === targetId);
                        if (targetAlbum) {
                            openLightbox(targetAlbum, 0);
                        }
                    }
                }

                function renderCategoryTabs() {
                    const tabsContainer = document.getElementById('galleryCategoryTabs');
                    if (!tabsContainer) return;

                    // Compute dynamic categories and counts
                    const catCounts = { all: allAlbums.length };
                    allAlbums.forEach(a => {
                        const c = a.category || 'Other';
                        catCounts[c] = (catCounts[c] || 0) + 1;
                    });

                    const categories = [
                        { id: 'all', label: 'Semua Kegiatan', color: 'blue' },
                        { id: 'Workshop', label: 'Workshop', color: 'blue' },
                        { id: 'Weekly Class', label: 'Weekly Class', color: 'green' },
                        { id: 'Info Session', label: 'Info Session', color: 'yellow' },
                        { id: 'Hackathon', label: 'Hackathon', color: 'red' },
                        { id: 'Community', label: 'Community', color: 'yellow' },
                        { id: 'Robotics', label: 'Robotics', color: 'blue' }
                    ];

                    tabsContainer.innerHTML = categories
                        .filter(cat => cat.id === 'all' || catCounts[cat.id])
                        .map(cat => {
                            const count = catCounts[cat.id] || 0;
                            const isActive = currentCategory === cat.id ? 'active' : '';
                            return `
                                <button type="button" class="gallery-cat-tab ${isActive}" onclick="selectCategory('${cat.id}', this)">
                                    <span class="gallery-cat-dot" style="color: ${colorMap[cat.color] || '#4285F4'};"></span>
                                    <span>${cat.label}</span>
                                    <span class="gallery-cat-count">${count}</span>
                                </button>
                            `;
                        }).join('');
                }

                window.selectCategory = function (cat, btn) {
                    currentCategory = cat;
                    document.querySelectorAll('.gallery-cat-tab').forEach(b => b.classList.remove('active'));
                    if (btn) btn.classList.add('active');
                    filterGallery();
                };

                window.filterGallery = function () {
                    const searchInput = document.getElementById('gallerySearchInput');
                    currentSearchQuery = (searchInput?.value || '').trim().toLowerCase();

                    const filtered = allAlbums.filter(album => {
                        const matchCat = (currentCategory === 'all') || 
                            (album.category && album.category.toLowerCase() === currentCategory.toLowerCase());
                        const matchSearch = !currentSearchQuery || 
                            (album.title && album.title.toLowerCase().includes(currentSearchQuery)) ||
                            (album.desc && album.desc.toLowerCase().includes(currentSearchQuery)) ||
                            (album.category && album.category.toLowerCase().includes(currentSearchQuery)) ||
                            (album.date && album.date.toLowerCase().includes(currentSearchQuery));
                        return matchCat && matchSearch;
                    });

                    renderAlbums(filtered);
                };

                function renderAlbums(albums) {
                    const container = document.getElementById('galleryAlbumsContainer');
                    const counter = document.getElementById('galleryStatsCounter');
                    if (!container) return;

                    if (counter) {
                        const totalPhotos = albums.reduce((acc, a) => {
                            const count = Array.isArray(a.images) && a.images.length > 0 ? a.images.length : (a.image ? 1 : 0);
                            return acc + count;
                        }, 0);
                        counter.textContent = `${albums.length} Album • ${totalPhotos} Foto Dokumentasi`;
                    }

                    if (albums.length === 0) {
                        container.innerHTML = `
                            <div style="grid-column: 1 / -1; text-align: center; padding: 64px 20px; background: rgba(22, 24, 34, 0.4); border: 1px dashed rgba(255, 255, 255, 0.12); border-radius: var(--radius-lg);">
                                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 0 auto 14px; opacity: 0.4; color: var(--text-muted);">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                <p style="margin-bottom: 6px; font-weight: 600; color: #ffffff; font-size: 1.05rem;">Tidak ada dokumentasi kegiatan ditemukan</p>
                                <p style="font-size: 0.88rem; color: var(--text-secondary);">Coba kata kunci pencarian lain atau pilih kategori di atas.</p>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = albums.map((album, idx) => {
                        const colorName = album.color || 'blue';
                        const col = colorMap[colorName] || '#4285F4';
                        const photos = Array.isArray(album.images) && album.images.length > 0 
                            ? album.images 
                            : (album.image ? [album.image] : []);
                        const coverSrc = photos[0] || album.image || 'assets/images/events/weekly-class-2.jpg';
                        const photoCount = photos.length || 1;
                        const otherThumbs = photos.slice(1, 5);

                        return `
                            <article class="gallery-album-card ${colorName}" onclick="openLightboxByAlbumIndex(${idx})" tabindex="0" role="button" aria-label="Lihat album ${album.title}">
                                <div class="album-cover-wrapper">
                                    <img src="${coverSrc}" alt="${album.title}" class="album-cover-img" loading="lazy" onerror="this.src='assets/images/events/weekly-class-2.jpg'" />
                                    <span class="album-tag-pill" style="border-left: 3px solid ${col};">
                                        ${album.category || 'Activity'}
                                    </span>
                                    <span class="album-badge-count">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                                        </svg>
                                        <span>${photoCount} Foto</span>
                                    </span>
                                </div>

                                <div class="album-card-body">
                                    <div class="album-meta-row">
                                        <span>${album.date || 'GDGoC UNM'}</span>
                                    </div>
                                    <h3 class="album-title">${album.title || 'Dokumentasi Kegiatan'}</h3>
                                    ${album.desc ? `<p class="album-desc">${album.desc}</p>` : ''}

                                    ${otherThumbs.length > 0 ? `
                                        <div class="album-thumb-strip">
                                            ${otherThumbs.map(thumb => `
                                                <img src="${thumb}" alt="thumb" class="album-thumb-mini" loading="lazy" onerror="this.style.display='none'" />
                                            `).join('')}
                                            ${photoCount > 5 ? `
                                                <div class="album-thumb-more">
                                                    +${photoCount - 5}
                                                </div>
                                            ` : ''}
                                        </div>
                                    ` : ''}
                                </div>

                                <div class="album-card-footer">
                                    <span class="album-action-link">
                                        <span>Buka Album (${photoCount} Foto)</span>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                            <path d="M5 12h14M12 5l7 7-7 7"/>
                                        </svg>
                                    </span>
                                </div>
                            </article>
                        `;
                    }).join('');
                }

                // Lightbox Implementation
                window.openLightboxByAlbumIndex = function (index) {
                    const searchInput = document.getElementById('gallerySearchInput');
                    const q = (searchInput?.value || '').trim().toLowerCase();

                    const currentList = allAlbums.filter(album => {
                        const matchCat = (currentCategory === 'all') || 
                            (album.category && album.category.toLowerCase() === currentCategory.toLowerCase());
                        const matchSearch = !q || 
                            (album.title && album.title.toLowerCase().includes(q)) ||
                            (album.desc && album.desc.toLowerCase().includes(q)) ||
                            (album.category && album.category.toLowerCase().includes(q)) ||
                            (album.date && album.date.toLowerCase().includes(q));
                        return matchCat && matchSearch;
                    });

                    const album = currentList[index] || allAlbums[index];
                    if (album) openLightbox(album, 0);
                };

                window.openLightbox = function (album, photoIdx = 0) {
                    activeAlbum = album;
                    activePhotoIndex = photoIdx;

                    const photos = Array.isArray(album.images) && album.images.length > 0 ? album.images : (album.image ? [album.image] : []);
                    if (photos.length === 0) return;

                    document.getElementById('lightboxAlbumTitle').textContent = album.title || 'Dokumentasi Kegiatan';
                    document.getElementById('lightboxAlbumMeta').textContent = `${album.date || 'GDGoC UNM'} • ${album.category || 'Activity'}`;

                    updateLightboxPhoto();

                    // Render thumbs carousel
                    const thumbsContainer = document.getElementById('lightboxThumbsCarousel');
                    thumbsContainer.innerHTML = photos.map((src, i) => `
                        <img
                            src="${src}"
                            alt="photo thumbnail"
                            class="lightbox-thumb-item ${i === activePhotoIndex ? 'active' : ''}"
                            onclick="setLightboxPhoto(${i})"
                        />
                    `).join('');

                    const lightbox = document.getElementById('galleryLightbox');
                    lightbox.classList.add('open');
                    document.body.style.overflow = 'hidden';
                };

                window.closeLightbox = function () {
                    const lightbox = document.getElementById('galleryLightbox');
                    lightbox.classList.remove('open');
                    document.body.style.overflow = '';
                    activeAlbum = null;
                };

                window.navigateLightbox = function (direction) {
                    if (!activeAlbum) return;
                    const photos = Array.isArray(activeAlbum.images) && activeAlbum.images.length > 0 ? activeAlbum.images : (activeAlbum.image ? [activeAlbum.image] : []);
                    if (photos.length <= 1) return;

                    activePhotoIndex = (activePhotoIndex + direction + photos.length) % photos.length;
                    updateLightboxPhoto();
                };

                window.setLightboxPhoto = function (index) {
                    activePhotoIndex = index;
                    updateLightboxPhoto();
                };

                function updateLightboxPhoto() {
                    if (!activeAlbum) return;
                    const photos = Array.isArray(activeAlbum.images) && activeAlbum.images.length > 0 ? activeAlbum.images : (activeAlbum.image ? [activeAlbum.image] : []);
                    const curPhoto = photos[activePhotoIndex];

                    const mainImg = document.getElementById('lightboxMainImg');
                    mainImg.src = curPhoto;

                    const counter = document.getElementById('lightboxPhotoCounter');
                    counter.textContent = `Foto ${activePhotoIndex + 1} dari ${photos.length}`;

                    // Update active thumb
                    const thumbs = document.querySelectorAll('.lightbox-thumb-item');
                    thumbs.forEach((t, i) => {
                        if (i === activePhotoIndex) {
                            t.classList.add('active');
                            t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                        } else {
                            t.classList.remove('active');
                        }
                    });
                }

                // Keyboard Navigation
                document.addEventListener('keydown', function (e) {
                    const lightbox = document.getElementById('galleryLightbox');
                    if (!lightbox || !lightbox.classList.contains('open')) return;

                    if (e.key === 'Escape') {
                        closeLightbox();
                    } else if (e.key === 'ArrowLeft') {
                        navigateLightbox(-1);
                    } else if (e.key === 'ArrowRight') {
                        navigateLightbox(1);
                    }
                });

                // Load initial data
                loadGalleryAlbums();
            })();
        </script>
    </body>
</html>
