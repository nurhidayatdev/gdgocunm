<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ================================================================
    Google Developer Groups On Campus - Universitas Negeri Makassar (GDGoC UNM)
    Official Certificate Verification Portal — English Edition
    Google Apps Script Web App Interface
  ================================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Official certificate verification portal for Google Developer Groups on Campus - Universitas Negeri Makassar (GDGoC UNM). Verify authenticity and credentials in real-time." />
  <meta name="theme-color" content="#0a0b0e" />
  <title>Certificate Verification • GDGoC UNM</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/nurhidayatdev/gdgocunm/main/assets/logo/favicon.png" />

  <!-- Google Fonts: Google Sans (Matching Main Landing Page) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       Design System Tokens (Aligned with gdgocunm / css/style.css)
       Google AI Studio Inspired Dark Developer Aesthetic
       ========================================================================== */
    :root {
      /* Google Brand Colors */
      --google-blue: #4285f4;
      --google-red: #ea4335;
      --google-yellow: #fbbc04;
      --google-green: #34a853;

      /* Accent Bright Variants */
      --blue-light: #8ab4f8;
      --red-light: #f28b82;
      --yellow-light: #fdd663;
      --green-light: #81c995;

      /* Dark Theme Palette */
      --bg-primary: #0a0b0e;
      --bg-secondary: #111319;
      --bg-tertiary: #161822;
      --bg-card: rgba(20, 23, 32, 0.85);
      --bg-card-hover: rgba(26, 30, 42, 0.95);
      --bg-glass: rgba(16, 19, 27, 0.82);

      /* Borders & Dividers */
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-card: #232734;
      --border-card-hover: rgba(66, 133, 244, 0.45);
      --border-focus: #4285f4;

      /* Typography Colors */
      --text-primary: #f5f7fc;
      --text-secondary: #9aa0a6;
      --text-muted: #6b7280;

      /* Fonts */
      --font-sans: "Google Sans", system-ui, -apple-system, sans-serif;

      /* Radii & Shadows */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.55);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.7);

      --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Base Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Glows & Tech Grid (Exact replica from main site style.css) */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-glow::before {
      content: "";
      position: absolute;
      top: -10%;
      left: 15%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(66, 133, 244, 0.14) 0%, transparent 70%);
      filter: blur(80px);
    }

    .ambient-glow::after {
      content: "";
      position: absolute;
      top: 35%;
      right: -5%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(52, 168, 83, 0.1) 0%, rgba(251, 188, 4, 0.06) 40%, transparent 70%);
      filter: blur(90px);
    }

    .ambient-bottom-glow {
      position: fixed;
      bottom: -20%;
      left: 20%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(234, 67, 53, 0.08) 0%, rgba(66, 133, 244, 0.06) 50%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    .tech-grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 35%, transparent 95%);
      pointer-events: none;
      z-index: 0;
    }

    /* Page Container */
    .page-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      padding: 24px 20px 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Centered Content Wrapper (Centers Logo, Title, and Input vertically) */
    .content-center-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      gap: 20px;
      margin: auto 0;
      padding: 24px 0;
    }

    /* ==========================================================================
       Header / Navbar (Floating Frosted Glass Pill)
       ========================================================================== */
    .nav-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-md);
      transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
      animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .nav-pill:hover {
      border-color: rgba(66, 133, 244, 0.35);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65), 0 0 20px rgba(66, 133, 244, 0.15);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .nav-brand-logos {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-logo-icon {
      width: 34px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-logo-icon svg {
      width: 100%;
      height: 100%;
    }

    .nav-unm-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-unm-icon svg {
      width: 100%;
      height: 100%;
    }

    .nav-brand-text {
      display: flex;
      flex-direction: column;
    }

    .nav-brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-brand-title .campus-tag {
      color: var(--blue-light);
      font-weight: 600;
    }

    .nav-brand-sub {
      font-size: 0.72rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      background: rgba(52, 168, 83, 0.1);
      border: 1px solid rgba(52, 168, 83, 0.28);
      color: var(--green-light);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .nav-badge-status .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--google-green);
      box-shadow: 0 0 8px var(--google-green);
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    .nav-back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.76rem;
      font-weight: 500;
      text-decoration: none;
      transition: all var(--transition-fast);
    }

    .nav-back-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }

    @media (max-width: 580px) {
      .nav-back-link {
        display: none;
      }
    }

    /* ==========================================================================
       Hero Box / Title
       ========================================================================== */
    .hero-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 10px 0 6px;
      animation: fadeIn 0.7s ease-out both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Full Logo Brand Visual */
    .hero-brand-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 4px;
    }

    .hero-full-logo-img {
      max-width: 250px;
      width: 100%;
      height: auto;
      max-height: 65px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.5));
      transition: transform var(--transition-normal);
    }

    .hero-full-logo-img:hover {
      transform: scale(1.02);
    }

    .hero-pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      background: rgba(66, 133, 244, 0.1);
      border: 1px solid rgba(66, 133, 244, 0.25);
      color: var(--blue-light);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .hero-subtitle {
      max-width: 580px;
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ==========================================================================
       Input / Search Section (HIDES when certificate is verified)
       ========================================================================== */
    #search-section {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .search-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all var(--transition-normal);
    }

    .search-card:hover, .search-card:focus-within {
      border-color: var(--border-card-hover);
      box-shadow: var(--shadow-lg), 0 0 24px rgba(66, 133, 244, 0.12);
    }

    .search-label-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .search-badge-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .search-input-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 620px) {
      .search-input-group {
        flex-direction: column;
      }
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color var(--transition-fast);
    }

    .search-input {
      width: 100%;
      height: 44px;
      background: var(--bg-secondary);
      border: 1.5px solid var(--border-card);
      border-radius: var(--radius-pill);
      padding: 0 16px 0 40px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 500;
      outline: none;
      transition: all var(--transition-fast);
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.86rem;
    }

    .search-input:focus {
      border-color: var(--google-blue);
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.22);
      background: var(--bg-tertiary);
    }

    .search-input:focus + .search-icon {
      color: var(--google-blue);
    }

    /* Primary Button */
    .btn-verify {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 44px;
      padding: 0 22px;
      border-radius: var(--radius-pill);
      font-size: 0.88rem;
      font-weight: 600;
      font-family: var(--font-sans);
      background: var(--google-blue);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(66, 133, 244, 0.35);
      transition: all var(--transition-normal);
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (max-width: 620px) {
      .btn-verify {
        width: 100%;
      }
    }

    .btn-verify:hover:not(:disabled) {
      background: #3367d6;
      transform: translateY(-1.5px);
      box-shadow: 0 6px 22px rgba(66, 133, 244, 0.5);
    }

    .btn-verify:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-verify:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .search-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .search-hint code {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 5px;
      color: var(--blue-light);
      font-size: 0.78rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Collapsible Hiding Transitions */
    .section-collapsible {
      transition: opacity 0.35s ease, max-height 0.4s ease, transform 0.35s ease;
      overflow: hidden;
      max-height: 800px;
      opacity: 1;
    }

    .section-collapsible.hidden {
      max-height: 0 !important;
      opacity: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      margin-top: 0 !important;
      margin-bottom: 0 !important;
      transform: translateY(-12px);
      pointer-events: none;
    }

    /* ==========================================================================
       Result Area & States
       ========================================================================== */
    #result-area {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    /* Loading State */
    .state-loading {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.3s ease-out;
    }

    .spinner-ring {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(66, 133, 244, 0.15);
      border-top-color: var(--google-blue);
      border-right-color: var(--google-green);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Valid Card (Certificate Details) */
    .state-valid {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(52, 168, 83, 0.35);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-md), 0 0 24px rgba(52, 168, 83, 0.12);
      animation: popUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(12px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .valid-top-strip {
      height: 3px;
      background: linear-gradient(90deg, var(--google-blue), var(--google-green), var(--google-yellow), var(--google-blue));
      background-size: 300% 100%;
      animation: gradientShift 6s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .valid-content {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .valid-content {
        padding: 12px 14px;
        gap: 10px;
      }
    }

    /* Details Table */
    .cert-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .cert-table tr {
      border-bottom: 1px solid var(--border-subtle);
      transition: background var(--transition-fast);
    }

    .cert-table tr:last-child {
      border-bottom: none;
    }

    .cert-table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .cert-table th {
      width: 35%;
      padding: 9px 14px;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.015);
      border-right: 1px solid var(--border-subtle);
    }

    .cert-table td {
      padding: 9px 14px;
      font-size: 0.84rem;
      color: var(--text-primary);
    }

    @media (max-width: 520px) {
      .cert-table th {
        width: 38%;
        padding: 8px 10px;
        font-size: 0.74rem;
      }
      .cert-table td {
        padding: 8px 10px;
        font-size: 0.78rem;
      }
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .role-PARTICIPANT {
      background: rgba(66, 133, 244, 0.14);
      color: var(--blue-light);
      border: 1px solid rgba(66, 133, 244, 0.3);
    }

    .role-SPEAKER {
      background: rgba(234, 67, 53, 0.14);
      color: var(--red-light);
      border: 1px solid rgba(234, 67, 53, 0.3);
    }

    .role-MODERATOR {
      background: rgba(251, 188, 4, 0.14);
      color: var(--yellow-light);
      border: 1px solid rgba(251, 188, 4, 0.3);
    }

    .role-CORETEAM {
      background: rgba(52, 168, 83, 0.14);
      color: var(--green-light);
      border: 1px solid rgba(52, 168, 83, 0.3);
    }

    .cert-code-chip {
      display: inline-block;
      font-family: monospace;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--blue-light);
      background: rgba(66, 133, 244, 0.08);
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid rgba(66, 133, 244, 0.2);
    }

    .status-valid-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--green-light);
      font-weight: 700;
      font-size: 0.76rem;
    }

    .status-valid-chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--google-green);
      box-shadow: 0 0 5px var(--google-green);
    }

    /* ==========================================================================
       Official Signatory Box (Nur Hidayat - Lead GDGoC UNM)
       ========================================================================== */
    .signatory-box {
      background: rgba(14, 17, 25, 0.9);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .signatory-box::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, var(--google-blue), var(--google-green));
    }

    .signatory-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .signatory-avatar-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(66, 133, 244, 0.12);
      border: 1px solid rgba(66, 133, 244, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 5px;
      overflow: hidden;
    }

    .signatory-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .signatory-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .signatory-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .signatory-title {
      font-size: 0.72rem;
      color: var(--blue-light);
      font-weight: 500;
      line-height: 1.35;
    }

    .signatory-seal {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      flex-shrink: 0;
    }

    .signatory-stamp {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: rgba(52, 168, 83, 0.1);
      border: 1px solid rgba(52, 168, 83, 0.3);
      color: var(--green-light);
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .signatory-stamp-sub {
      font-size: 0.60rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    @media (max-width: 600px) {
      .signatory-box {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .signatory-seal {
        align-items: flex-start;
        text-align: left;
        margin-left: 44px;
      }
    }

    /* Result Action Buttons */
    .result-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 4px;
      border-top: 1px solid var(--border-subtle);
    }

    @media (max-width: 580px) {
      .result-actions button, .result-actions a {
        width: 100%;
        justify-content: center;
      }
    }

    .btn-secondary-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      font-weight: 600;
      font-family: var(--font-sans);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .btn-secondary-action:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .verified-timestamp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Invalid State Card */
    .state-invalid {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(234, 67, 53, 0.35);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-md), 0 0 24px rgba(234, 67, 53, 0.12);
      animation: popUp 0.35s ease-out both, shakeCard 0.45s 0.1s ease-in-out;
    }

    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .invalid-top-strip {
      height: 3px;
      background: var(--google-red);
    }

    .invalid-content {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .invalid-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(234, 67, 53, 0.15);
      border: 1px solid rgba(234, 67, 53, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--google-red);
      box-shadow: 0 0 16px rgba(234, 67, 53, 0.2);
    }

    .invalid-icon svg {
      width: 22px;
      height: 22px;
    }

    .invalid-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .invalid-error-code {
      display: inline-block;
      font-family: monospace;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--red-light);
      background: rgba(234, 67, 53, 0.1);
      border: 1px solid rgba(234, 67, 53, 0.25);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    .invalid-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.5;
    }

    .invalid-tips {
      width: 100%;
      max-width: 520px;
      text-align: left;
      background: var(--bg-secondary);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }

    .invalid-tips h4 {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .invalid-tips ul {
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .invalid-tips code {
      background: rgba(255, 255, 255, 0.07);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--yellow-light);
    }

    /* ==========================================================================
       Info Strip (Bottom cards: Hides when verified)
       ========================================================================== */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      transition: all var(--transition-normal);
    }

    @media (max-width: 720px) {
      .info-grid {
        grid-template-columns: 1fr;
      }
    }

    .info-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform var(--transition-normal), border-color var(--transition-normal);
    }

    .info-card:hover {
      transform: translateY(-3px);
      border-color: rgba(66, 133, 244, 0.3);
    }

    .info-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-icon-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-icon-box.blue {
      background: rgba(66, 133, 244, 0.12);
      color: var(--blue-light);
    }

    .info-icon-box.green {
      background: rgba(52, 168, 83, 0.12);
      color: var(--green-light);
    }

    .info-icon-box.yellow {
      background: rgba(251, 188, 4, 0.12);
      color: var(--yellow-light);
    }

    .info-card-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .info-card-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ==========================================================================
       Footer (Compact & Sleek)
       ========================================================================== */
    .site-footer {
      margin-top: auto;
      padding-top: 14px;
      padding-bottom: 6px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .footer-google-dots {
      display: flex;
      gap: 6px;
    }

    .footer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .footer-text {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .footer-text strong {
      color: var(--text-secondary);
    }

    /* Print Styles */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }
      .ambient-glow, .ambient-bottom-glow, .tech-grid-overlay, .nav-pill, .search-card, .info-grid, .site-footer, .result-actions {
        display: none !important;
      }
      .page-container {
        max-width: 100% !important;
        padding: 0 !important;
      }
      .state-valid {
        border: 2px solid #2e7d32 !important;
        box-shadow: none !important;
        background: #fff !important;
        color: #000 !important;
      }
      .cert-table {
        background: #fff !important;
        border: 1px solid #ddd !important;
      }
      .cert-table th, .cert-table td {
        color: #000 !important;
        border-color: #ddd !important;
      }
      .signatory-box {
        background: #f9f9f9 !important;
        border: 1px solid #ccc !important;
        color: #000 !important;
      }
      .signatory-name {
        color: #000 !important;
      }
      .signatory-title {
        color: #333 !important;
      }
      .valid-heading, .valid-subheading {
        color: #000 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Light Vignettes & Tech Grid Overlay -->
  <div class="ambient-glow" aria-hidden="true"></div>
  <div class="ambient-bottom-glow" aria-hidden="true"></div>
  <div class="tech-grid-overlay" aria-hidden="true"></div>

  <div class="page-container">

    <!-- Vertically Centered Wrapper (Hero, Search Form, and Result) -->
    <div class="content-center-wrapper">
      <!-- ========================================================================
           Hero Section
           ======================================================================== -->
      <section class="hero-box">
        <!-- Official GDGoC UNM Full Logo Artwork -->
        <div class="hero-brand-visual" aria-label="GDGoC UNM Official Logo">
          <img
            src="assets/logo/logo-gdgoc-full.png"
            onerror="if(!this.dataset.retried){this.dataset.retried='1';this.src='https://gdgocunm.netlify.app/assets/logo/logo-gdgoc-full.png';}"
            alt="GDGoC UNM Official Logo"
            class="hero-full-logo-img"
          />
        </div>

        <h1 class="hero-title">Certificate Verification</h1>
        <p class="hero-subtitle">
          Verify the authenticity and credentials of official certificates issued by Google Developer Groups on Campus &mdash; Universitas Negeri Makassar.
        </p>
      </section>

      <!-- ========================================================================
           Input Section (HIDES when certificate is verified)
           ======================================================================== -->
      <section class="section-collapsible" id="search-section" aria-label="Certificate Search Form">
        <div class="search-card">
          <div class="search-label-group">
            <label class="search-label" for="cert-id-input">Enter Certificate ID</label>
            <span class="search-badge-hint">Case-insensitive</span>
          </div>

          <div class="search-input-group">
            <div class="search-input-wrapper">
              <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input
                type="text"
                id="cert-id-input"
                class="search-input"
                name="cert-id"
                placeholder="e.g. GDG-UNM/X/26/MBR001"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="characters"
                spellcheck="false"
                aria-label="Enter Certificate ID"
              />
            </div>

            <button type="button" id="verify-btn" class="btn-verify" aria-label="Verify Certificate">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <span>Verify Certificate</span>
            </button>
          </div>
        </div>
      </section>

      <!-- ========================================================================
           Result Area (Certificate Card shown here)
           ======================================================================== -->
      <main id="result-area" role="status" aria-live="polite" aria-label="Verification Result"></main>
    </div>



    <!-- ========================================================================
         Footer
         ======================================================================== -->
    <footer class="site-footer" role="contentinfo">
      <div class="footer-google-dots">
        <span class="footer-dot" style="background:#4285f4"></span>
        <span class="footer-dot" style="background:#ea4335"></span>
        <span class="footer-dot" style="background:#fbbc04"></span>
        <span class="footer-dot" style="background:#34a853"></span>
      </div>
      <p class="footer-text">
        &copy; 2026/2027 <strong>GDGoC UNM</strong> &bull; Universitas Negeri Makassar &bull; Official Verification System
      </p>
    </footer>

  </div>

  <!-- ========================================================================
       Client Logic
       ======================================================================== -->
  <script>
  (function(){
    "use strict";

    var searchSectionEl = document.getElementById("search-section");
    var inputEl = document.getElementById("cert-id-input");
    var btnEl = document.getElementById("verify-btn");
    var resultEl = document.getElementById("result-area");

    /* Helper: Escape HTML to prevent XSS */
    function esc(s) {
      var d = document.createElement("div");
      d.appendChild(document.createTextNode(s || ""));
      return d.innerHTML;
    }

    /* Helper: Hide / Unhide Search Input */
    function hideInput(shouldHide) {
      if (searchSectionEl) {
        if (shouldHide) {
          searchSectionEl.classList.add("hidden");
        } else {
          searchSectionEl.classList.remove("hidden");
        }
      }
    }

    function setBtnLoading(loading) {
      if (!btnEl) return;
      btnEl.disabled = loading;
      if (loading) {
        btnEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin .9s linear infinite" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> <span>Verifying&hellip;</span>';
      } else {
        btnEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> <span>Verify Certificate</span>';
      }
    }

    function showLoading() {
      resultEl.innerHTML = '<div class="state-loading" role="status"><div class="spinner-ring" aria-hidden="true"></div><p class="loading-text">Connecting to official GDGoC UNM database&hellip;</p></div>';
    }

    function getRoleBadgeClass(role) {
      var m = {
        "PARTICIPANT": "role-PARTICIPANT",
        "SPEAKER": "role-SPEAKER",
        "MODERATOR": "role-MODERATOR",
        "CORE TEAM": "role-CORETEAM"
      };
      return m[(role || "").toUpperCase()] || "role-PARTICIPANT";
    }

    /* Render Valid Certificate Detail */
    function renderValid(data) {
      var roleClass = getRoleBadgeClass(data.peran);

      var rows = [
        ["Recipient Name", "<strong>" + esc(data.nama_penerima) + "</strong>"],
        ["Role / Capacity", '<span class="role-badge ' + roleClass + '">' + esc(data.peran) + '</span>'],
        ["Event Name", esc(data.nama_event)],
        ["Issue Date", esc(data.tanggal_terbit)],
        ["Certificate ID", '<span class="cert-code-chip">' + esc(data.id_sertifikat) + '</span>'],
        ["Status", '<span class="status-valid-chip">OFFICIALLY VALID & ACTIVE</span>']
      ].map(function(r){
        return "<tr><th scope=\"row\">" + r[0] + "</th><td>" + r[1] + "</td></tr>";
      }).join("");

      resultEl.innerHTML = 
        '<div class="state-valid" role="alert">' +
          '<div class="valid-top-strip" aria-hidden="true"></div>' +
          '<div class="valid-content">' +
            '<table class="cert-table" role="table">' +
              '<tbody>' + rows + '</tbody>' +
            '</table>' +

            '<!-- Official Signatory & Community Leadership Endorsement -->' +
            '<div class="signatory-box" role="region" aria-label="Authorized Signatory">' +
              '<div class="signatory-left">' +
                '<div class="signatory-avatar-badge" aria-hidden="true">' +
                  '<img src="assets/logo/favicon.png" onerror="if(!this.dataset.tried1){this.dataset.tried1=\'1\';this.src=\'../assets/logo/favicon.png\';}else if(!this.dataset.tried2){this.dataset.tried2=\'1\';this.src=\'https://raw.githubusercontent.com/nurhidayatdev/gdgocunm/main/assets/logo/favicon.png\';}" alt="GDGoC UNM" class="signatory-avatar-img" />' +
                '</div>' +
                '<div class="signatory-details">' +
                  '<span class="signatory-name">Nur Hidayat</span>' +
                  '<span class="signatory-title">Community Lead<br>Google Developer Groups on Campus &bull; Universitas Negeri Makassar</span>' +
                '</div>' +
              '</div>' +
              '<div class="signatory-seal">' +
                '<span class="signatory-stamp">' +
                  '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
                  'Leadership Verified' +
                '</span>' +
                '<span class="signatory-stamp-sub">Official GDGoC UNM Credential</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    /* Render Invalid Certificate Detail */
    function renderInvalid(code, msg) {
      // Keep input visible so the user can fix typos
      hideInput(false);

      resultEl.innerHTML = 
        '<div class="state-invalid" role="alert">' +
          '<div class="invalid-top-strip" aria-hidden="true"></div>' +
          '<div class="invalid-content">' +
            '<div class="invalid-icon" aria-hidden="true">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
            '</div>' +
            '<h2 class="invalid-title">Certificate Not Found</h2>' +
            '<span class="invalid-error-code">ERROR: ' + esc(code || "NOT_FOUND") + '</span>' +
            '<p class="invalid-desc">' + esc(msg || "The certificate ID you entered is not registered in the official database of GDGoC UNM.") + '</p>' +

            '<div class="invalid-tips">' +
              '<h4>Verification Troubleshooting:</h4>' +
              '<ul>' +
                '<li>Double-check slashes (<code>/</code>) and hyphens (<code>-</code>).</li>' +
                '<li>Ensure role code is correct (e.g., <code>MBR001</code>, <code>SPK001</code>).</li>' +
                '<li>Expected format pattern: <code>GDG-UNM/X/26/MBR001</code></li>' +
                '<li>If you believe this is an error, please reach out to the GDGoC UNM Core Team.</li>' +
              '</ul>' +
            '</div>' +

            '<button type="button" class="btn-secondary-action" id="btn-retry">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>' +
              '<span>Try Entering Again</span>' +
            '</button>' +
          '</div>' +
        '</div>';

      var btnRetry = document.getElementById("btn-retry");
      if (btnRetry && inputEl) {
        btnRetry.addEventListener("click", function() {
          inputEl.focus();
          inputEl.select();
        });
      }

      resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    /* ========================================================================
       Direct Google Sheets Integration (No Apps Script Required)
       Uses Google Visualization Query API (Public View Sheet)
       ======================================================================== */
    var SPREADSHEET_ID = "1wxe4WThXlGSj2iocQ4NPnqmZRcJvYl3sMDLJLwQRTM8";
    var SHEET_NAME = "Database_Sertifikat";
    var cachedRecords = null;

    /* Fetch all records from Google Sheets via GViz API */
    async function fetchSheetRecords() {
      if (cachedRecords) {
        return cachedRecords;
      }

      var gvizUrl = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID + 
                    "/gviz/tq?tqx=out:json&sheet=" + encodeURIComponent(SHEET_NAME);

      var response = await fetch(gvizUrl);
      if (!response.ok) {
        throw new Error("HTTP " + response.status + " while accessing Google Sheets");
      }

      var rawText = await response.text();
      var jsonStart = rawText.indexOf("{");
      var jsonEnd = rawText.lastIndexOf("}");
      if (jsonStart === -1 || jsonEnd === -1) {
        throw new Error("Invalid response format received from Google Sheets");
      }

      var parsed = JSON.parse(rawText.substring(jsonStart, jsonEnd + 1));
      if (!parsed.table || !parsed.table.rows) {
        throw new Error("No data rows found in Google Sheets");
      }

      var records = [];
      var rows = parsed.table.rows;
      for (var i = 0; i < rows.length; i++) {
        var c = rows[i].c;
        if (!c) continue;
        var idVal = c[0] && c[0].v != null ? String(c[0].v).trim() : "";
        if (!idVal) continue;

        records.push({
          id_sertifikat: idVal,
          nama_penerima: c[1] && c[1].v != null ? String(c[1].v).trim() : "-",
          peran: c[2] && c[2].v != null ? String(c[2].v).trim() : "PARTICIPANT",
          nama_event: c[3] && c[3].v != null ? String(c[3].v).trim() : "-",
          tanggal_terbit: c[4] ? (c[4].f ? String(c[4].f).trim() : (c[4].v != null ? String(c[4].v).trim() : "-")) : "-",
          status: c[5] && c[5].v != null ? String(c[5].v).trim().toUpperCase() : "VALID"
        });
      }

      cachedRecords = records;
      return records;
    }

    /* Verification Logic */
    async function runVerification(certId) {
      var trimmed = (certId || "").trim();
      if (!trimmed) {
        renderInvalid("INPUT_EMPTY", "Certificate ID cannot be empty. Please enter a valid certificate number.");
        if (inputEl) inputEl.focus();
        return;
      }

      if (trimmed.length < 5) {
        renderInvalid("INVALID_LENGTH", "The Certificate ID entered is too short. Please provide the complete ID.");
        if (inputEl) inputEl.focus();
        return;
      }

      showLoading();
      setBtnLoading(true);

      try {
        var records = await fetchSheetRecords();
        setBtnLoading(false);

        var query = trimmed.toUpperCase();
        var found = null;
        for (var i = 0; i < records.length; i++) {
          if (records[i].id_sertifikat.toUpperCase() === query) {
            found = records[i];
            break;
          }
        }

        if (!found) {
          renderInvalid("NOT_FOUND", "The certificate ID \"" + esc(trimmed) + "\" is not registered in the official database of GDGoC UNM.");
          return;
        }

        if (found.status === "REVOKED") {
          renderInvalid("CERT_REVOKED", "This certificate has been officially REVOKED by GDGoC UNM and is no longer valid in our registry.");
          return;
        }

        renderValid(found);

      } catch (err) {
        setBtnLoading(false);
        console.error("Verification error:", err);
        renderInvalid("DATABASE_ERROR", "Failed to connect to Google Sheets. Please ensure the spreadsheet link sharing is set to \"Anyone with the link can view\" (Viewer).");
      }
    }

    /* Event Listeners */
    if (btnEl && inputEl) {
      btnEl.addEventListener("click", function() {
        runVerification(inputEl.value);
      });

      inputEl.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          runVerification(inputEl.value);
        }
      });
    }

    /* Auto-Verify via URL query (?id=...) */
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var idParam = params.get("id");
        if (idParam && idParam.trim() !== "") {
          var cleanId = idParam.trim();
          if (inputEl) inputEl.value = cleanId;
          setTimeout(function() {
            runVerification(cleanId);
          }, 250);
        }
      } catch (e) {
        console.warn("Could not parse query parameters:", e);
      }
    })();

  })();
  </script>
</body>
</html>
