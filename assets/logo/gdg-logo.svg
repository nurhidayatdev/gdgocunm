<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Red capsule gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5B4A"/>
      <stop offset="60%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#C5221F"/>
    </linearGradient>
    <!-- Blue capsule gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#669DF6"/>
      <stop offset="60%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
    <!-- Green capsule gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BB974"/>
      <stop offset="60%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#1E8E3E"/>
    </linearGradient>
    <!-- Yellow capsule gradient -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDD663"/>
      <stop offset="60%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#F29900"/>
    </linearGradient>

    <!-- Specular highlight for 3D pill look -->
    <linearGradient id="pillHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="subtleDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#subtleDropShadow)">
    <!-- LEFT BRACKET < -->
    <!-- Red Top Left Capsule -->
    <g transform="translate(142, 134) rotate(-38)">
      <rect x="-65" y="-19" width="130" height="38" rx="19" fill="url(#redGrad)"/>
      <rect x="-65" y="-19" width="130" height="38" rx="19" fill="url(#pillHighlight)"/>
    </g>

    <!-- Blue Bottom Left Capsule -->
    <g transform="translate(142, 172) rotate(38)">
      <rect x="-65" y="-19" width="130" height="38" rx="19" fill="url(#blueGrad)"/>
      <rect x="-65" y="-19" width="130" height="38" rx="19" fill="url(#pillHighlight)"/>
    </g>

    <!-- RIGHT BRACKET > -->
    <!-- Green Top Right Capsule -->
    <g transform="translate(258, 134) rotate(38)">
      <rect x="-65" y="-19" width="130" height="38" rx="19" fill="url(#greenGrad)"/>
      <rect x="-65" y="-19" width="130" height="38" rx="19" fill="url(#pillHighlight)"/>
    </g>

    <!-- Yellow Bottom Right Capsule -->
    <g transform="translate(258, 172) rotate(-38)">
      <rect x="-65" y="-19" width="130" height="38" rx="19" fill="url(#yellowGrad)"/>
      <rect x="-65" y="-19" width="130" height="38" rx="19" fill="url(#pillHighlight)"/>
    </g>
  </g>
</svg>
