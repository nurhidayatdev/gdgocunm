<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pinisiGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA4335" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#FBBC04" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#34A853" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FBBC04" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g opacity="0.85" filter="url(#neonGlow)">
    <!-- Base podium -->
    <path d="M 120 740 L 480 740 L 450 780 L 150 780 Z" stroke="#333842" stroke-width="2" fill="#13151b" fill-opacity="0.6"/>
    <line x1="80" y1="780" x2="520" y2="780" stroke="#4285F4" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Central Tower Core -->
    <path d="M 270 740 L 275 220 L 325 220 L 330 740 Z" stroke="#2c303c" stroke-width="2" fill="#151821" fill-opacity="0.4"/>

    <!-- Left Wing (Phinisi Sail Left Arch) -->
    <path d="M 160 720 Q 140 450 290 230" stroke="url(#pinisiGlow)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 175 720 Q 158 460 292 245" stroke="#34A853" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M 195 720 Q 180 480 295 260" stroke="#FBBC04" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Right Wing (Phinisi Sail Right Sweeping Arch) -->
    <path d="M 440 720 Q 480 380 310 140" stroke="url(#pinisiGlow)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 425 720 Q 460 395 308 160" stroke="#4285F4" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M 405 720 Q 440 420 305 185" stroke="#EA4335" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Horizontal Louver Lines (Pinisi Slats) -->
    <!-- Lower Level -->
    <path d="M 170 700 L 430 700" stroke="#333842" stroke-width="1.5"/>
    <path d="M 175 670 L 435 670" stroke="#333842" stroke-width="1.5"/>
    <path d="M 180 640 L 440 640" stroke="#3a404d" stroke-width="1.5"/>
    <path d="M 185 610 L 445 610" stroke="#3a404d" stroke-width="1.5"/>
    <path d="M 190 580 L 450 580" stroke="url(#lineGrad)" stroke-width="2"/>
    <path d="M 195 550 L 452 550" stroke="#3a404d" stroke-width="1.5"/>
    
    <!-- Mid Level -->
    <path d="M 205 520 L 450 520" stroke="#3a404d" stroke-width="1.5"/>
    <path d="M 215 490 L 445 490" stroke="url(#lineGrad)" stroke-width="2"/>
    <path d="M 225 460 L 440 460" stroke="#3a404d" stroke-width="1.5"/>
    <path d="M 235 430 L 430 430" stroke="#3a404d" stroke-width="1.5"/>
    <path d="M 245 400 L 420 400" stroke="url(#lineGrad)" stroke-width="2"/>

    <!-- Upper Level -->
    <path d="M 255 370 L 405 370" stroke="#3a404d" stroke-width="1.5"/>
    <path d="M 265 340 L 390 340" stroke="#3a404d" stroke-width="1.5"/>
    <path d="M 275 310 L 375 310" stroke="url(#lineGrad)" stroke-width="2"/>
    <path d="M 285 280 L 355 280" stroke="#4285F4" stroke-width="1.5" stroke-opacity="0.7"/>
    <path d="M 295 250 L 340 250" stroke="#4285F4" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Mast & Crown Spire (Puncak Pinisi) -->
    <path d="M 300 230 L 300 110" stroke="#FBBC04" stroke-width="3" stroke-linecap="round"/>
    <polygon points="300,90 306,115 294,115" fill="#FBBC04"/>
    <circle cx="300" cy="85" r="5" fill="#4285F4" filter="url(#neonGlow)"/>

    <!-- UNM Emblem Center Ring -->
    <circle cx="300" cy="460" r="32" stroke="#FBBC04" stroke-width="2" fill="#13151b" fill-opacity="0.8"/>
    <circle cx="300" cy="460" r="26" stroke="#4285F4" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="300" cy="460" r="16" stroke="#34A853" stroke-width="1.5"/>
    <!-- Center stylized flame/seed of UNM -->
    <path d="M 300 448 C 308 456 308 466 300 472 C 292 466 292 456 300 448 Z" fill="#FBBC04"/>

    <!-- Geometric grid accents & radar coordinates -->
    <circle cx="300" cy="460" r="180" stroke="#252936" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
    <circle cx="300" cy="460" r="240" stroke="#252936" stroke-width="1" stroke-dasharray="2 10" opacity="0.3"/>
  </g>
</svg>
